<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Numerical Methods in Python — NumPy, SciPy, and Matplotlib Toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B18"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="indigoGlow" cx="80%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="18%" cy="84%" r="42%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#indigoGlow)"/>
  <rect width="1200" height="320" rx="20" fill="url(#tealGlow)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#topBar)"/>

  <!-- Pill Badge -->
  <g transform="translate(64, 52)">
    <rect x="0" y="0" width="292" height="30" rx="15" fill="#171E36" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#38BDF8"/>
    <text x="30" y="19.5" fill="#E0E7FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.4">PYTHON · NUMPY · SCIPY · MATPLOTLIB</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="64" y="140" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.2">Numerical Methods</text>
  <text x="64" y="178" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18.5">Curve fitting, interpolation, quadrature, RK4 ODE &amp; SIR epidemic modeling</text>

  <!-- Module Chips -->
  <g transform="translate(64, 214)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="142" height="34" rx="10" fill="#171E36" stroke="#334155"/>
    <text x="71" y="21.5" text-anchor="middle" fill="#38BDF8">Least Squares</text>

    <rect x="154" y="0" width="142" height="34" rx="10" fill="#171E36" stroke="#334155"/>
    <text x="225" y="21.5" text-anchor="middle" fill="#A5B4FC">Newton / Spline</text>

    <rect x="308" y="0" width="152" height="34" rx="10" fill="#171E36" stroke="#334155"/>
    <text x="384" y="21.5" text-anchor="middle" fill="#34D399">Simpson 1/3 &amp; 3/8</text>

    <rect x="472" y="0" width="144" height="34" rx="10" fill="#171E36" stroke="#334155"/>
    <text x="544" y="21.5" text-anchor="middle" fill="#FDBA74">RK4 &amp; SIR ODE</text>
  </g>

  <!-- Right-side Scientific Curve Plot Card -->
  <g transform="translate(796, 46)">
    <rect x="0" y="0" width="340" height="228" rx="18" fill="#0B1120" fill-opacity="0.92" stroke="#334155" stroke-width="1.2"/>
    <text x="22" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">SIR EPIDEMIC · RK4 SOLVER</text>
    <rect x="244" y="18" width="74" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="281" y="33" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">O(h⁴)</text>

    <!-- Axes -->
    <line x1="28" y1="168" x2="314" y2="168" stroke="#334155" stroke-width="1.2"/>
    <line x1="28" y1="54" x2="28" y2="168" stroke="#334155" stroke-width="1.2"/>

    <!-- Baseline red bell curve -->
    <path d="M 30 166 C 72 164, 102 64, 134 64 C 168 64, 200 158, 312 166" fill="none" stroke="#EF4444" stroke-width="2.6"/>
    <!-- Social distancing green flattened curve -->
    <path d="M 30 166 C 110 165, 162 114, 206 114 C 248 114, 282 156, 312 164" fill="none" stroke="#10B981" stroke-width="2.4" stroke-dasharray="5 4"/>
    <!-- Vaccination blue low curve -->
    <path d="M 30 166 C 100 165, 148 134, 188 134 C 232 134, 276 162, 312 166" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-dasharray="8 4"/>

    <!-- Formula Footer -->
    <rect x="22" y="182" width="296" height="30" rx="8" fill="#171E36"/>
    <text x="170" y="201" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">S(t) + I(t) + R(t) = N · 8/8 unittest pass</text>
  </g>
</svg>
